<!doctype html>
<!--
PATTERN 10 · Before / after split (after-pane wipes in, before desaturates)
USE: old vs new, with one measured number per side. The new value alone takes the accent.
PARAMS (P): before {tag,big,desc,row}, after {tag,big,desc,row}, verdict, wipe. Numbers come from KIT.md.
CUES: before = MV.cue(1), wipe = MV.cue(2), verdict = MV.cue(3).
AVOID: numbers that are not measured on the same basis on both sides.
-->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../theme.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="../harness.js"></script>
<style>
  .pane{position:absolute;top:0;bottom:0;width:960px;padding:170px 100px}
  .before{left:0;background:var(--bg)}
  .after{left:960px;background:var(--panel)}
  .tag{font:600 26px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .after .tag{color:var(--accent)}
  .big{font:900 170px/1 var(--font-display);letter-spacing:-.045em;margin:40px 0 24px;font-variant-numeric:tabular-nums}
  .after .big{color:var(--accent)}
  .desc{font:400 36px/1.4 var(--font-body);color:var(--muted);max-width:720px}
  .row{font:500 28px/1.5 var(--font-mono);margin-top:36px;color:var(--ink)}
  .divider{position:absolute;left:958px;top:0;width:4px;height:1080px;background:var(--accent);transform-origin:top}
  .verdict{position:absolute;z-index:2;left:50%;bottom:150px;transform:translateX(-50%);font:600 34px/1 var(--font-body);white-space:nowrap;
           padding:20px 34px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
  .verdict .em{font-size:40px}
</style></head>
<body><div id="root" data-composition-id="before-after-split" data-start="0" data-duration="7" data-width="1920" data-height="1080">
  <div class="pane before" id="before"><div class="tag"></div><div class="big"></div><div class="desc"></div><div class="row"></div></div>
  <div class="pane after" id="after"><div class="tag"></div><div class="big"></div><div class="desc"></div><div class="row"></div></div>
  <div class="divider" id="divider"></div>
  <div class="verdict" id="verdict"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
const P = {
  before: {tag:'Before', big:'100 u', desc:'How the old way worked, in one line.', row:'× the cost it carried'},   // DEMO VALUE
  after:  {tag:'After',  big:'10 u',  desc:'How the new way works, in one line.',  row:'✓ what it buys'},           // DEMO VALUE
  verdict: 'Ten times <span class="em">less</span>, same result',                                                 // DEMO VALUE
  wipe: 0.8,
};
['before', 'after'].forEach(k => { const el = document.getElementById(k).children, d = P[k];
  el[0].textContent = d.tag; el[1].textContent = d.big; el[2].textContent = d.desc; el[3].textContent = d.row; });
document.getElementById('verdict').innerHTML = P.verdict;
gsap.set(['#before > *', '#after > *', '#verdict'], {opacity:0}); gsap.set('#after', {clipPath:'inset(0 100% 0 0)'}); gsap.set('#divider', {scaleY:0});
MV.scene((tl, MV) => {
  const before = MV.cue(1, 0.2), wipe = MV.cue(2, 2.2), verdict = MV.cue(3, 4.4);
  tl.fromTo('#before > *', {opacity:0, y:24}, {opacity:1, y:0, duration:.5, ease:'power2.out', stagger:.15}, before)
    .fromTo('#divider', {scaleY:0}, {scaleY:1, duration:.4, ease:'power2.out'}, wipe - .3)
    .fromTo('#after', {clipPath:'inset(0 100% 0 0)'}, {clipPath:'inset(0 0% 0 0)', duration:P.wipe, ease:'power3.inOut'}, wipe)
    .fromTo('#after > *', {opacity:0, x:30}, {opacity:1, x:0, duration:.5, ease:'power2.out', stagger:.15}, wipe + .3)
    .fromTo('#before', {filter:'saturate(1) brightness(1)'}, {filter:'saturate(0) brightness(.6)', duration:.8}, wipe + .4)
    .fromTo('#verdict', {opacity:0, y:20}, {opacity:1, y:0, duration:.5, ease:'power3.out'}, verdict);
});
</script></body></html>
