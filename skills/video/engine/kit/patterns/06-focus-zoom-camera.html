<!doctype html>
<!--
PATTERN 06 · Focus-zoom camera (hold, short eased move, hold)
USE: a dense slide where focus follows the narration. The camera pushes to the item being spoken.
PARAMS (P): eyebrow, title, cards [[k,h,p]], shots [{line, target}], fill, move, maxScale.
CUES: each shot moves at MV.cue(shot.line); target null = back to wide.
MATH: outer #cam-scale scales about the stage centre; inner #cam-pan translates by (960-cx, 540-cy).
      Every target is measured at identity, after fonts.ready, before any camera tween is added.
AVOID: slow continuous zoom over text (glyph shimmer); will-change on the camera (blurry text).
-->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../theme.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="../harness.js"></script>
<style>
  #cam-scale{position:absolute;inset:0;transform-origin:960px 540px}
  #cam-pan{position:absolute;inset:0}
  .grid{position:absolute;left:var(--pad);right:var(--pad);top:300px;display:grid;grid-template-columns:repeat(4,1fr);gap:36px}
  .card{padding:40px 36px;height:420px}
  .card .k{font:600 24px/1 var(--font-mono);color:var(--accent);letter-spacing:.1em}
  .card h3{font:700 44px/1.1 var(--font-display);margin:22px 0 18px}
  .card p{font:400 28px/1.4 var(--font-body);color:var(--muted)}
  .title{position:absolute;left:var(--pad);top:110px}
</style></head>
<body><div id="root" data-composition-id="focus-zoom-camera" data-start="0" data-duration="10" data-width="1920" data-height="1080">
 <div id="cam-scale"><div id="cam-pan">
  <div class="title"><div class="eyebrow" id="eyebrow"></div><div class="h2" id="title" style="margin-top:20px"></div></div>
  <div class="grid" id="grid"></div>
 </div></div>
</div>
<script>
window.__timelines = window.__timelines || {};
const P = {
  eyebrow: 'Overview',                                  // DEMO VALUE
  title: 'Four parts, one frame',                       // DEMO VALUE
  cards: [ ['01', 'Part one',   'A short line describing part one.'],     // DEMO VALUE
           ['02', 'Part two',   'A short line describing part two.'],     // DEMO VALUE
           ['03', 'Part three', 'A short line describing part three.'],   // DEMO VALUE
           ['04', 'Part four',  'A short line describing part four.'] ],  // DEMO VALUE
  shots: [ {line:2, target:'#c2', at:1.5}, {line:3, target:'#c4', at:4.0},
           {line:4, target:'.title', at:6.5}, {line:5, target:null, at:8.5} ],   // at = fallback without cues
  fill: 0.62, move: 0.85, maxScale: 2.4, ease: 'power3.inOut',
};
document.getElementById('eyebrow').textContent = P.eyebrow;
document.getElementById('title').textContent = P.title;
P.cards.forEach(([k, h, p], i) => document.getElementById('grid').insertAdjacentHTML('beforeend',
  `<div class="card" id="c${i + 1}"><div class="k">${k}</div><h3>${h}</h3><p>${p}</p></div>`));
gsap.set('.title, .card', {opacity:0});
MV.scene((tl, MV) => {
  const stage = document.getElementById('root').getBoundingClientRect();
  const measure = sel => { const r = document.querySelector(sel).getBoundingClientRect();
    return { cx: r.left - stage.left + r.width / 2, cy: r.top - stage.top + r.height / 2, w: r.width, h: r.height }; };
  const frames = P.shots.map(s => {             // measure everything first, camera at identity
    const at = MV.cue(s.line, s.at);
    if (!s.target) return { at, x: 0, y: 0, s: 1 };
    const m = measure(s.target), sc = Math.min(P.maxScale, 1920 * P.fill / m.w, 1080 * P.fill / m.h);
    return { at, x: 960 - m.cx, y: 540 - m.cy, s: Math.max(1, sc) };
  });
  gsap.set('#cam-pan', {x:0, y:0}); gsap.set('#cam-scale', {scale:1});
  let prev = { x: 0, y: 0, s: 1 };
  frames.forEach(f => {   // fromTo from the previous shot => every seek lands on the same pixels
    tl.fromTo('#cam-pan', {x:prev.x, y:prev.y}, {x:f.x, y:f.y, duration:P.move, ease:P.ease, immediateRender:false}, f.at)
      .fromTo('#cam-scale', {scale:prev.s}, {scale:f.s, duration:P.move, ease:P.ease, immediateRender:false}, f.at);
    prev = f;
  });
  tl.fromTo('.title, .card', {opacity:0, y:20}, {opacity:1, y:0, duration:.5, ease:'power2.out', stagger:.12}, MV.cue(1, 0.1));
});
</script></body></html>
