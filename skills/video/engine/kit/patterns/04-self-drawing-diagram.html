<!doctype html>
<!--
PATTERN 04 · Self-drawing diagram (nodes pop as named, edges draw themselves)
USE: architecture / flow. Each node appears when the narrator names it; the edge into it draws just before.
PARAMS (P): eyebrow, title, nodes {n1..n4: [name, sub]}, edgeDur, edgeLead. Geometry lives in the SVG.
CUES: n1..n4 = MV.wordOf(line, name) or MV.cue(i). Default: n1..n4 = lines 1..4.
AVOID: more than ~6 nodes on one frame; edges that cross.
-->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../theme.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/DrawSVGPlugin.min.js"></script>
<script src="../harness.js"></script>
<style>
  svg{position:absolute;left:0;top:0}
  .node rect{fill:var(--panel);stroke:var(--line);stroke-width:2}
  .node text{fill:var(--ink);font:600 34px var(--font-body);text-anchor:middle;dominant-baseline:central}
  .node .sub{fill:var(--muted);font:400 22px var(--font-mono)}
  .node{transform-box:fill-box;transform-origin:center}
  .edge{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
  .title{position:absolute;left:var(--pad);top:110px}
</style></head>
<body><div id="root" data-composition-id="self-drawing-diagram" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="title"><div class="eyebrow" id="eyebrow"></div><div class="h2" id="title" style="margin-top:20px"></div></div>
  <svg width="1920" height="1080" viewBox="0 0 1920 1080">
    <path id="e-1-2" class="edge" d="M480 600 L700 600"/>
    <path id="e-2-3" class="edge" d="M1010 600 C1080 600 1080 470 1150 470"/>
    <path id="e-2-4" class="edge" d="M1010 600 C1080 600 1080 730 1150 730"/>
    <g id="n1" class="node"><rect x="170" y="530" width="310" height="140" rx="18"/><text x="325" y="585"></text><text class="sub" x="325" y="628"></text></g>
    <g id="n2" class="node"><rect x="700" y="530" width="310" height="140" rx="18"/><text x="855" y="585"></text><text class="sub" x="855" y="628"></text></g>
    <g id="n3" class="node"><rect x="1150" y="400" width="360" height="140" rx="18"/><text x="1330" y="455"></text><text class="sub" x="1330" y="498"></text></g>
    <g id="n4" class="node"><rect x="1150" y="660" width="360" height="140" rx="18"/><text x="1330" y="715"></text><text class="sub" x="1330" y="758"></text></g>
  </svg>
</div>
<script>
window.__timelines = window.__timelines || {};
const P = {
  eyebrow: 'How it works',               // DEMO VALUE
  title: 'Input to output',              // DEMO VALUE
  nodes: { n1: ['Input', 'source file'],       // DEMO VALUE
           n2: ['Stage A', 'transforms'],      // DEMO VALUE
           n3: ['Stage B', 'branch one'],      // DEMO VALUE
           n4: ['Stage C', 'branch two'] },    // DEMO VALUE
  edgeDur: 0.6, edgeLead: 0.55,
};
document.getElementById('eyebrow').textContent = P.eyebrow;
document.getElementById('title').textContent = P.title;
Object.entries(P.nodes).forEach(([id, [name, sub]]) => { const t = document.querySelectorAll('#' + id + ' text'); t[0].textContent = name; t[1].textContent = sub; });
gsap.registerPlugin(DrawSVGPlugin);
gsap.set(['.title', '.node'], {opacity:0}); gsap.set('.edge', {drawSVG:'0%'});
MV.scene((tl, MV) => {
  const at = { n1: MV.cue(1, 0.6), n2: MV.cue(2, 1.6), n3: MV.cue(3, 2.8), n4: MV.cue(4, 3.6) };
  const pop = (id, t) => tl
    .fromTo(id, {opacity:0, scale:.6}, {opacity:1, scale:1, duration:.45, ease:'back.out(1.6)'}, t)
    .fromTo(id + ' rect', {stroke:MV.tok('accent')}, {stroke:MV.tok('line'), duration:.8, ease:'power1.out'}, t + .3);
  const edge = (id, t) => tl.fromTo(id, {drawSVG:'0%'}, {drawSVG:'100%', duration:P.edgeDur, ease:'power2.inOut'}, t - P.edgeLead);
  tl.fromTo('.title', {opacity:0, y:14}, {opacity:1, y:0, duration:.4}, Math.max(0, at.n1 - .5));
  pop('#n1', at.n1);
  edge('#e-1-2', at.n2); pop('#n2', at.n2);
  edge('#e-2-3', at.n3); pop('#n3', at.n3);
  edge('#e-2-4', at.n4); pop('#n4', at.n4);
});
</script></body></html>
