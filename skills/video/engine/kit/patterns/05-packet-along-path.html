<!doctype html>
<!--
PATTERN 05 · Packet along path (MotionPath; hubs pulse on arrival)
USE: requests or data moving through a system. The route draws first, then packets travel it.
PARAMS (P): eyebrow, title, hubs [a,b,c] labels, packets, spacing, travel.
CUES: path = MV.cue(1), packets = MV.cue(2).
AVOID: more than ~6 packets; packets that never arrive before the scene ends.
-->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../theme.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/MotionPathPlugin.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/DrawSVGPlugin.min.js"></script>
<script src="../harness.js"></script>
<style>
  svg{position:absolute;inset:0}
  .route-line{fill:none;stroke:var(--line);stroke-width:6;stroke-linecap:round}
  .hub{fill:var(--panel);stroke:var(--line);stroke-width:3}
  .hub-l{fill:var(--ink);font:600 30px var(--font-body);text-anchor:middle}
  .pkt{fill:var(--accent)}
  .title{position:absolute;left:var(--pad);top:110px}
</style></head>
<body><div id="root" data-composition-id="packet-along-path" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="title"><div class="eyebrow" id="eyebrow"></div><div class="h2" id="title" style="margin-top:20px"></div></div>
  <svg width="1920" height="1080" viewBox="0 0 1920 1080">
    <path id="route" class="route-line" d="M260 640 C560 640 620 460 960 460 S1360 640 1660 640"/>
    <circle class="hub" id="hA" cx="260" cy="640" r="70"/><text class="hub-l" id="lA" x="260" y="760"></text>
    <circle class="hub" id="hB" cx="960" cy="460" r="70"/><text class="hub-l" id="lB" x="960" y="370"></text>
    <circle class="hub" id="hC" cx="1660" cy="640" r="70"/><text class="hub-l" id="lC" x="1660" y="760"></text>
    <g id="pkts"></g>
  </svg>
</div>
<script>
window.__timelines = window.__timelines || {};
const P = {
  eyebrow: 'Data path',                        // DEMO VALUE
  title: 'Every packet crosses the middle',    // DEMO VALUE
  hubs: ['Source', 'Relay', 'Sink'],           // DEMO VALUE
  packets: 4, spacing: 0.55, travel: 1.8,
};
document.getElementById('eyebrow').textContent = P.eyebrow;
document.getElementById('title').textContent = P.title;
['lA', 'lB', 'lC'].forEach((id, i) => document.getElementById(id).textContent = P.hubs[i]);
gsap.registerPlugin(MotionPathPlugin, DrawSVGPlugin);
const g = document.getElementById('pkts');
for (let i = 0; i < P.packets; i++) g.insertAdjacentHTML('beforeend', `<circle class="pkt" r="14" cx="0" cy="0"/>`);
gsap.set('.title', {opacity:0}); gsap.set('.pkt', {opacity:0}); gsap.set('#route', {drawSVG:'0%'});
MV.scene((tl, MV) => {
  const path = MV.cue(1, 0.5), packets = MV.cue(2, 1.4);
  const line = MV.tok('line'), accent = MV.tok('accent'), dim = MV.tok('dim');
  tl.fromTo('.title', {opacity:0, y:14}, {opacity:1, y:0, duration:.4}, Math.max(0, path - .4))
    .fromTo('#route', {drawSVG:'0%'}, {drawSVG:'100%', duration:.9, ease:'power2.inOut'}, path)
    .fromTo('#route', {stroke:line}, {stroke:dim, duration:.4, immediateRender:false}, path + .9);
  [...g.children].forEach((p, i) => {
    const at = packets + i * P.spacing;
    tl.fromTo(p, {opacity:0}, {opacity:1, duration:.15, immediateRender:false}, at)
      .fromTo(p, {motionPath:{path:'#route', align:'#route', alignOrigin:[.5,.5], start:0, end:0}},
                 {motionPath:{path:'#route', align:'#route', alignOrigin:[.5,.5], start:0, end:1}, duration:P.travel, ease:'none'}, at)
      .fromTo(p, {opacity:1}, {opacity:0, duration:.15, immediateRender:false}, at + P.travel - .1)
      .fromTo('#hB', {stroke:accent, strokeWidth:6}, {stroke:line, strokeWidth:3, duration:.5, immediateRender:false}, at + P.travel * .5)
      .fromTo('#hC', {stroke:accent, strokeWidth:6}, {stroke:line, strokeWidth:3, duration:.5, immediateRender:false}, at + P.travel);
  });
});
</script></body></html>
